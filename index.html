<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <!-- این خط برای موبایل و تبلت خیلی مهمه -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>سایت من</title>
    
    <style>
        /* کد CSS ریسپانسیو رو اینجا می‌نویسیم */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; padding: 15px; }
        img { max-width: 100%; height: auto; }
        
        @media (max-width: 768px) {
            body { font-size: 16px; }
            button { padding: 12px; font-size: 18px; }
        }
    </style>
</head>
<body>

    <h1>سلام! این تیتر منه</h1>
    <p>این یه متن معمولیه که توی گوشی هم درست نشون داده میشه.</p>
    
    <img src="image.jpg" alt="تصویر نمونه">
    
    <button>دکمه من</button>

</body>
</html>
